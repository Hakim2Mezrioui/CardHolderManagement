<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">Cartes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .sidebar {
        min-height: 100vh;
        background-color: #f8f9fa;
    }
    .card-number {
        font-family: monospace;
        font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
      <div class="position-sticky pt-3">
        <h5 class="text-center mb-3">
          <i class="fas fa-credit-card"></i> Card Manager
        </h5>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="/web/">
              <i class="fas fa-home"></i> Accueil
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/web/users">
              <i class="fas fa-users"></i> Utilisateurs
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/web/users/new">
              <i class="fas fa-user-plus"></i> Nouvel Utilisateur
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/web/cards">
              <i class="fas fa-credit-card"></i> Toutes les Cartes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/web/cards/active">
              <i class="fas fa-check-circle"></i> Cartes Actives
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/web/cards/expired">
              <i class="fas fa-times-circle"></i> Cartes Expirées
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Main content -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div class="pt-3">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="h2" th:text="${title}">Cartes</h1>
          <a href="/web/cards" class="btn btn-secondary">
            <i class="fas fa-search"></i> Recherche Avancée
          </a>
        </div>

        <div class="card">
          <div class="card-body">
            <div th:if="${#lists.isEmpty(cards)}" class="text-center py-4">
              <i class="fas fa-credit-card fa-3x text-muted mb-3"></i>
              <h5 class="text-muted">Aucune carte trouvée</h5>
              <p class="text-muted">Aucune carte ne correspond aux critères.</p>
            </div>

            <div th:if="${!#lists.isEmpty(cards)}" class="table-responsive">
              <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                  <th>Numéro</th>
                  <th>Type</th>
                  <th>Propriétaire</th>
                  <th>Email</th>
                  <th>Expiration</th>
                  <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="card : ${cards}">
                  <td>
                    <span class="card-number" th:text="${card.cardNumber}"></span>
                  </td>
                  <td>
                    <i class="fas fa-credit-card"></i>
                    <span th:text="${card.type}"></span>
                  </td>
                  <td>
                    <a th:href="@{/web/users/{id}(id=${card.user.id})}"
                       class="text-decoration-none">
                      <i class="fas fa-user"></i>
                      <span th:text="${card.user.name}"></span>
                    </a>
                  </td>
                  <td th:text="${card.user.email}"></td>
                  <td th:text="${card.expirationDate}"></td>
                  <td>
                    <div class="btn-group" role="group">
                      <a th:href="@{/web/users/{id}(id=${card.user.id})}"
                         class="btn btn-sm btn-outline-primary"
                         title="Voir utilisateur">
                        <i class="fas fa-user"></i>
                      </a>
                      <a th:href="@{/web/cards/{id}/delete(id=${card.id})}"
                         class="btn btn-sm btn-outline-danger"
                         onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette carte ?')"
                         title="Supprimer">
                        <i class="fas fa-trash"></i>
                      </a>
                    </div>
                  </td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
